name: Exact vCard restore
on:
  push:
    paths:
      - "TRIGGER_EXACT_VCF"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore juan-martinez.vcf without ORG
        run: |
          set -euo pipefail
          git show 3b7bfba070f3601c381fdf2df957fc6e1e7830b9:juan-martinez.vcf > juan-martinez.vcf
          python3 <<'PY'
          from pathlib import Path
          p = Path("juan-martinez.vcf")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          for line in lines:
            if line.startswith("ORG:"):
              continue
            if line.startswith("REV:"):
              out.append("REV:2026-09-02T19:36:00Z\n")
              continue
            out.append(line)
          text = "".join(out)
          if not text.endswith("\n"):
            text += "\n"
          p.write_text(text)
          PY
          test "$(wc -c < juan-martinez.vcf)" -eq 27350
          echo "40de87c56a2b716319814f33b5fb16c5a972cac2a632be9bea830a114d9ec2c6 juan-martinez.vcf" | sha256sum -c
          grep -q "TITLE:Steward of Liberty" juan-martinez.vcf
          grep -q "PHOTO;ENCODING=b;TYPE=JPEG:" juan-martinez.vcf
          grep -q "X-ABLabel:Website" juan-martinez.vcf
          grep -q "X-ABLabel:Twitter/X" juan-martinez.vcf
          grep -q "X-ABLabel:Facebook" juan-martinez.vcf
          grep -q "X-ABLabel:LinkedIn" juan-martinez.vcf
          ! grep -q '^ORG:' juan-martinez.vcf
          rm -f TRIGGER_EXACT_VCF
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Mr-Juanderful"
          git config user.email "cisco702fbi@yahoo.com"
          git add juan-martinez.vcf
          git add -u TRIGGER_EXACT_VCF || true
          if git diff --cached --quiet; then echo "already exact"; exit 0; fi
          git commit -m "Remove ORG Faith Family Freedom from vCard; keep TITLE Steward of Liberty"
          git push origin HEAD:main
